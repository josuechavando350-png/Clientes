const ROMAN=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let r='';for(const[v,s]of m)while(n>=v){r+=s;n-=v}return r};
const okImg=u=>/^(https:\/\/|data:image\/|\/media\/[\w\/.-]+$|__ERIC_RESOURCE_\d+__$)/.test(String(u||''));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- limpieza de HTML ---------- */
const INL={EM:0,I:0,STRONG:0,B:0,BR:0,U:0,S:0,SMALL:0,SUP:0,SUB:0,MARK:0,SPAN:1,A:2};
const BLK={P:0,H3:0,H4:0,UL:0,OL:0,LI:0,BLOCKQUOTE:0,FIGURE:0,FIGCAPTION:0,IMG:3,HR:0};
const DROP=/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META|SVG|TEMPLATE|FORM|INPUT|BUTTON|TEXTAREA|SELECT|VIDEO|AUDIO)$/;
function safeHref(h){h=String(h||'').trim();if(!h)return'';if(/^(https?:|mailto:|tel:|#)/i.test(h))return h;if(/^javascript:|^data:|^vbscript:/i.test(h))return'';if(/^[\w\-./%?=&#]+$/.test(h))return h;return''}
function clean(html,rich){const box=INERT.createElement('div');box.innerHTML=String(html==null?'':html);
 (function walk(n){for(const c of[...n.childNodes]){
  if(c.nodeType===3)continue;if(c.nodeType!==1){c.remove();continue}
  const tg=c.tagName.toUpperCase();if(DROP.test(tg)){c.remove();continue}
  let k=tg in INL?INL[tg]:(rich&&tg in BLK?BLK[tg]:-1);
  if(tg==='SPAN'&&/\b(b25|b26-red|cms-[\w-]+)\b/.test(c.className||''))k=-1;
  if(k===-1){walk(c);c.replaceWith(...c.childNodes);continue}
  for(const a of[...c.attributes]){const nm=a.name.toLowerCase();const ok=(k===1&&nm==='class')||(k===2&&(nm==='href'||nm==='target'))||(k===3&&(nm==='src'||nm==='alt'));if(!ok)c.removeAttribute(a.name)}
  if(k===2){const h=safeHref(c.getAttribute('href'));if(h)c.setAttribute('href',h);else c.removeAttribute('href');if(c.getAttribute('target')==='_blank')c.setAttribute('rel','noopener')}
  if(k===3&&!/^(https:|data:image\/)/.test(c.getAttribute('src')||'')){c.remove();continue}
  walk(c)}})(box);
 return box.innerHTML.replace(/^(\s|&nbsp;|<br>)+$/,'')}

/* ---------- ámbitos y claves ---------- */
function scopeOf(el,route){const parts=[];let x=el,base=route;
 while(x&&x.nodeType===1){
  if(x.hasAttribute('data-eitem')&&x.parentElement&&x.parentElement.hasAttribute('data-elist'))parts.push(x.parentElement.getAttribute('data-elist')+'~'+(x.getAttribute('data-eid')||x.getAttribute('data-eitem')));
  if(x.hasAttribute('data-escope')){base='@'+x.getAttribute('data-escope');break}
  x=x.parentElement}
 return base+(parts.length?'/'+parts.reverse().join('/'):'')}
const listKey=(box,route)=>scopeOf(box,route)+'/'+box.getAttribute('data-elist');
const itemsOf=box=>[...box.children].filter(c=>c.hasAttribute('data-eitem'));
const listSig=box=>hash(itemsOf(box).map(k=>k.getAttribute('data-eitem')).join(','));

function retag(el,suffix){const map={};
 [el,...el.querySelectorAll('[id]')].forEach(n=>{if(n.id){const v=n.id+'-'+suffix;map[n.id]=v;n.id=v}});
 [el,...el.querySelectorAll('[aria-controls],[aria-labelledby],[aria-describedby],[for],a[href^="#"]')].forEach(n=>{
  for(const a of['aria-controls','aria-labelledby','aria-describedby','for']){const v=n.getAttribute&&n.getAttribute(a);if(v&&map[v])n.setAttribute(a,map[v])}
  const h=n.getAttribute&&n.getAttribute('href');if(h&&h[0]==='#'&&map[h.slice(1)])n.setAttribute('href','#'+map[h.slice(1)])})}

function rebuild(box,route,C,edit){
 const kids=itemsOf(box);if(!kids.length)return;
 const lk=listKey(box,route),sig=listSig(box);
 box.setAttribute('data-elk',lk);box.setAttribute('data-esig',sig);
 const spec=C.l[lk];if(!spec||spec.s!==sig||!Array.isArray(spec.items))return;
 const base={};kids.forEach(k=>base[k.getAttribute('data-eitem')]=k);
 const anchor=kids[kids.length-1].nextSibling;kids.forEach(k=>k.remove());
 const placed=new Set();
 for(const it of spec.items){const b=it&&base[it.b];if(!b)continue;if(it.x&&!edit)continue;
  let el;if(it.id===it.b&&!placed.has(it.b)){el=b;placed.add(it.b)}else{el=b.cloneNode(true);retag(el,String(it.id).replace(/\W/g,''))}
  if(it.id!==it.b)el.setAttribute('data-eid',it.id);if(it.x)el.setAttribute('data-ehidden','');
  box.insertBefore(el,anchor)}}
function lists(node,route,C,edit){for(const el of[...node.children]){if(el.tagName==='SCRIPT'||el.tagName==='STYLE')continue;
 if(el.hasAttribute('data-elist'))rebuild(el,route,C,edit);lists(el,route,C,edit)}}

/* ---------- campos ---------- */
function fields(doc,route,C,edit,vals){
 doc.querySelectorAll('[data-et],[data-eimg],[data-ehref]').forEach(el=>{const sc=scopeOf(el,route);
  if(el.hasAttribute('data-et')){const k=sc+'/'+el.getAttribute('data-et'),h=hash(el.innerHTML),o=C.t[k];
   if(o&&o[1]===h)el.innerHTML=clean(o[0]);if(edit){el.setAttribute('data-k',k);el.setAttribute('data-eh',h);vals[k]=el.innerHTML}}
  if(el.hasAttribute('data-eimg')){const k=sc+'/'+el.getAttribute('data-eimg'),h=hash(el.getAttribute('src')||''),o=C.i[k];
   if(o&&o[1]===h&&okImg(o[0])){el.setAttribute('src',o[0]);el.removeAttribute('srcset');el.setAttribute('data-eover','')}
   if(edit){el.setAttribute('data-ki',k);el.setAttribute('data-eih',h)}}
  if(el.hasAttribute('data-ehref')){const k=sc+'/'+el.getAttribute('data-ehref'),h=hash(el.getAttribute('href')||''),o=C.h[k];
   if(o&&o[1]===h){const s=safeHref(o[0]);if(s)el.setAttribute('href',s)}
   if(edit){el.setAttribute('data-kh',k);el.setAttribute('data-ehh',h)}}})}

/* ---------- videos de Eric TV ---------- */
function parseVideo(url){url=String(url||'').trim();let m;
 if((m=url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/)))return{kind:'yt',id:m[1],url:'https://youtu.be/'+m[1]};
 if((m=url.match(/open\.spotify\.com\/(?:intl-[\w-]+\/)?(?:embed\/)?(episode|show|track)\/([A-Za-z0-9]+)/)))return{kind:'sp',type:m[1],id:m[2],url:`https://open.spotify.com/${m[1]}/${m[2]}`};
 if(/tiktok\.com\//.test(url)&&/^https:\/\//.test(url)){m=url.match(/\/video\/(\d+)/);return{kind:'tt',id:m?m[1]:'',url}}
 return null}
function setVideo(card,url){const v=parseVideo(url);if(!v)return;const im=card.querySelector('img');
 if(v.kind==='yt'&&card.classList.contains('b32-yt')){card.setAttribute('href',v.url);card.setAttribute('data-id',v.id);if(im&&!im.hasAttribute('data-eover'))im.setAttribute('src',`https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg`)}
 else if(v.kind==='sp'&&card.classList.contains('b32-sp')){card.setAttribute('href',v.url);card.setAttribute('data-id',v.id);card.setAttribute('data-type',v.type)}
 else if(v.kind==='tt'&&card.classList.contains('b32-tt')){const a=card.querySelector('[data-kind="tt"]')||card.querySelector('.b32-hit');if(a){a.setAttribute('href',v.url);a.setAttribute('data-url',v.url);if(v.id)a.setAttribute('data-id',v.id);else a.removeAttribute('data-id')}}}
function videos(doc,route,C){doc.querySelectorAll('[data-elist="tv"]>[data-eitem]').forEach(card=>{const u=C.vid[scopeOf(card,route)];if(u)setVideo(card,u)})}

/* ---------- ajustes generales ---------- */
function settings(doc,C){const s=C.s||{};
 if(s.wa||s.waText!=null)doc.querySelectorAll('a[href*="wa.me/"]').forEach(a=>{const m=(a.getAttribute('href')||'').match(/wa\.me\/(\d+)(?:\?text=([^#]*))?/);if(!m)return;
  const num=String(s.wa||m[1]).replace(/\D/g,'');let text=s.waText!=null?String(s.waText):(m[2]?decodeURIComponent(m[2]):'');
  a.setAttribute('href','https://wa.me/'+num+(text?'?text='+encodeURIComponent(text):''))});
 if(s.cal&&/^https:\/\//.test(s.cal))doc.querySelectorAll('a[href*="calendly.com"]').forEach(a=>a.setAttribute('href',s.cal))}
function seo(doc,route,C){const x=C.seo&&C.seo[route];if(!x)return;
 if(x.title)doc.title=x.title;
 if(x.desc){let m=doc.querySelector('meta[name="description"]');if(!m){m=doc.createElement('meta');m.setAttribute('name','description');doc.head.appendChild(m)}m.setAttribute('content',x.desc);
  let og=doc.querySelector('meta[property="og:description"]');if(og)og.setAttribute('content',x.desc)}
 if(x.title){const og=doc.querySelector('meta[property="og:title"]');if(og)og.setAttribute('content',x.title)}}

/* ---------- Historias y Recursos ---------- */
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'publicacion';
function posts(doc,route,C,edit){
 if(route!=='historias'&&route!=='recursos')return;
 const res=doc.querySelector('.reserved-section');if(!res)return;
 const list=(C.posts[route]||[]).filter(p=>p&&!p.x&&(p.title||p.body));
 if(!list.length){if(edit)res.setAttribute('data-cms-posts',route);return}
 const isR=route==='recursos',used={};
 const items=list.map(p=>{if(p.img&&!okImg(p.img))p={...p,img:''};let s=slug(p.slug||p.title);if(used[s])s+='-'+(++used[s]);else used[s]=1;return{...p,s}});
 const card=p=>{const ext=isR&&p.link&&!p.body;const href=ext?esc(safeHref(p.link)):'#p-'+p.s;
  return`<a class="cms-card${p.img?'':' cms-card--plain'}" href="${href}"${ext?' target="_blank" rel="noopener"':''}>${p.img?`<span class="cms-card-im"><img src="${esc(p.img)}" alt="" loading="lazy"></span>`:''}<span class="cms-card-tx">${p.date?`<time>${esc(p.date)}</time>`:''}<b>${esc(p.title)}</b>${p.excerpt?`<span>${esc(p.excerpt)}</span>`:''}<i>${ext?(p.cta||'Descargar')+' ↗':'Leer'} →</i></span></a>`};
 const art=p=>p.body?`<article class="cms-art" id="p-${p.s}"><div class="wrap cms-art-w">${p.date?`<time>${esc(p.date)}</time>`:''}<h2>${esc(p.title)}</h2>${p.excerpt?`<p class="cms-art-lead">${esc(p.excerpt)}</p>`:''}${p.img?`<figure class="cms-art-im"><img src="${esc(p.img)}" alt="" loading="lazy"></figure>`:''}<div class="cms-art-body">${clean(p.body,true)}</div>${isR&&p.link?`<a class="cms-art-dl" href="${esc(safeHref(p.link))}" target="_blank" rel="noopener">${esc(p.cta||'Descargar recurso')} ↗</a>`:''}<a class="cms-art-back" href="#publicaciones">Volver al índice ↑</a></div></article>`:'';
 const sec=doc.createElement('section');sec.className='section cms-posts';sec.id='publicaciones';
 sec.innerHTML=`<div class="wrap"><div class="cms-grid">${items.map(card).join('')}</div></div>`;
 const arts=doc.createElement('section');arts.className='cms-arts';arts.innerHTML=items.map(art).join('');
 res.replaceWith(sec);sec.after(arts);if(edit)sec.setAttribute('data-cms-posts',route);
 const rb=doc.querySelector('meta[name="robots"]');if(rb&&/noindex/.test(rb.getAttribute('content')||''))rb.setAttribute('content','index,follow,max-image-preview:large')}

function finish(doc,edit){
 [...doc.querySelectorAll('.b21-folio')].forEach((f,i)=>{f.textContent=ROMAN(i+1)});
 const pr=doc.querySelector('.b29-intro-t'),ps=pr&&pr.closest('.b29-intro');
 if(ps){if(pr.textContent.trim())ps.removeAttribute('hidden');else if(!edit)ps.setAttribute('hidden','')}}

/* ---------- render ---------- */
const api={edit:EDIT,editUI:EDIT,content:null,cfg:CFG,title:'',hash,norm,clean,parseVideo,safeHref,slug,ROMAN};
function prepare(html,route,edit){const C=norm(api.content);const doc=new DOMParser().parseFromString(html,'text/html');const vals={};
 lists(doc.body,route,C,edit);fields(doc,route,C,edit,vals);videos(doc,route,C);settings(doc,C);seo(doc,route,C);posts(doc,route,C,edit);finish(doc,edit);
 return{doc,vals}}
api.render=(html,route)=>{const edit=api.editUI;const{doc,vals}=prepare(html,route,edit);api.title=doc.title||'';
 if(edit&&typeof CMS_RT==='string'){const st=doc.createElement('style');st.id='cms-edit-css';st.textContent=CMS_RT_CSS;doc.head.appendChild(st);
  const sc=doc.createElement('script');sc.id='cms-edit-js';sc.textContent='window.__CMS='+JSON.stringify({vals,route}).replace(/</g,'\\u003c')+';'+CMS_RT;doc.body.appendChild(sc)}
 return'<!doctype html>\n'+doc.documentElement.outerHTML};
/* información de una lista para el panel (galería, Eric TV) */
api.query=(route,lk)=>{if(!ERIC_PAGES[route])return null;const{doc}=prepare(ERIC_PAGES[route],route,true);
 const box=doc.querySelector(`[data-elk="${CSS.escape(lk)}"]`);if(!box)return null;
 const hyd=s=>{s=String(s||'').replace(/__ERIC_RESOURCE_(\d+)__/g,(_,i)=>ERIC_RESOURCES[Number(i)]);return api.resolve?api.resolve(route,s):s};
 return{lk,sig:box.getAttribute('data-esig'),items:itemsOf(box).map(it=>{const f={};
  it.querySelectorAll('[data-k]').forEach(e=>{f[e.getAttribute('data-k').split('/').pop()]={k:e.getAttribute('data-k'),h:e.getAttribute('data-eh'),v:e.textContent.trim()}});
  const imgs=[...it.querySelectorAll('img[data-ki]')].map(e=>({k:e.getAttribute('data-ki'),h:e.getAttribute('data-eih'),src:hyd(e.getAttribute('src'))}));
  const a=it.matches('a[href]')?it:it.querySelector('a[data-kind],a[href]');
  const kind=it.classList.contains('b32-yt')?'yt':it.classList.contains('b32-sp')?'sp':it.classList.contains('b32-tt')?'tt':'';
  return{id:it.getAttribute('data-eid')||it.getAttribute('data-eitem'),b:it.getAttribute('data-eitem'),x:it.hasAttribute('data-ehidden')?1:0,kind,url:a?(a.getAttribute('data-url')||a.getAttribute('href')):'',f,imgs}})}};

/* ---------- carga del contenido publicado ---------- */
api.ready=(async()=>{
 if(EDIT)return new Promise(res=>{let done=false;const fin=c=>{if(done)return;done=true;api.content=c?norm(c):null;res()};
  W.addEventListener('message',e=>{if(e.source===W.parent&&e.data&&e.data.type==='CMS_SET'&&!done){if('edit'in e.data)api.editUI=!!e.data.edit;fin(e.data.content)}});
  try{W.parent.postMessage({type:'CMS_SHELL',routes:Object.keys(ERIC_PAGES)},'*')}catch(e){}
  setTimeout(()=>fin(null),5000)});
})();
return api})();

/* Marco de edición para la versión de 14 páginas.
   Lee cada página base desde api.php, le aplica el contenido (borrador del panel)
   y la muestra; al publicar, genera las 14 páginas finales. */
CMS.resolve=(route,src)=>{try{return new URL(src,location.origin+'/'+ERIC_FILES[route]).href}catch(e){return src}};
(()=>{'use strict';
const frame=document.getElementById('ericFrame');
const API=(window.ERIC_CMS_CONFIG||{}).api||'/api.php';
const known=r=>Object.prototype.hasOwnProperty.call(ERIC_FILES,r);
const toPanel=m=>{try{parent.postMessage(m,'*')}catch(e){}};
let current='',lastY=0,pendY=null,pendAt='';

async function loadPages(){
 await Promise.all(Object.entries(ERIC_FILES).map(async([r,f])=>{
  const res=await fetch(API+'?a=base&p='+encodeURIComponent(f),{credentials:'same-origin',cache:'no-store'});
  if(!res.ok)throw new Error(res.status===401?'La sesión terminó. Vuelva a entrar.':'No pude leer la página '+f+' ('+res.status+').');
  ERIC_PAGES[r]=await res.text()}))}

function markup(route){
 let h=CMS.render(ERIC_PAGES[route],route);
 h=h.replace(/data-intro="first"/,'data-intro="skip"');
 const base='<base href="'+location.origin+'/'+ERIC_FILES[route]+'">';
 return h.replace(/<head([^>]*)>/i,m=>m+base)}

function go(route,force,at){if(!known(route)||ERIC_PAGES[route]==null)return;
 if(route===current&&!force){if(at)frame.contentWindow&&frame.contentWindow.postMessage({type:'ERIC_SCROLL',at},'*');return}
 current=route;pendAt=at||'';toPanel({type:'CMS_ROUTE',route});
 try{frame.srcdoc=markup(route)}catch(err){console.error(err);toPanel({type:'CMS_ERROR',msg:'No pude mostrar la página: '+err.message})}}

frame.addEventListener('load',()=>{try{frame.contentWindow.postMessage({type:'ERIC_MOTION_APPLY',reduced:!!CMS.editUI},'*')}catch(e){}});

addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object')return;
 if(e.source===parent){
  if(d.type==='CMS_SET'){if(d.content)CMS.content=CMS.norm(d.content);if('edit'in d)CMS.editUI=!!d.edit;if(d.render&&current){pendY=d.keep===false?0:lastY;go(current,true)}}
  else if(d.type==='CMS_GO'){if(known(d.route)){pendY=0;lastY=0;go(d.route,true)}}
  else if(d.type==='CMS_QUERY'){let r=null;try{r=CMS.query(d.route,d.lk)}catch(err){console.error(err)}toPanel({type:'CMS_QUERY_R',qid:d.qid,r})}
  else if(d.type==='CMS_PAGE'){if(frame.contentWindow)frame.contentWindow.postMessage(Object.assign({},d.msg,{cms:1}),'*')}
  else if(d.type==='CMS_BUILD'){const prev=CMS.editUI;const files={};let err='';
   try{CMS.editUI=false;for(const[r,f]of Object.entries(ERIC_FILES))files[f]=CMS.render(ERIC_PAGES[r],r)}catch(x){err=x.message||String(x)}finally{CMS.editUI=prev}
   toPanel({type:'CMS_BUILD_R',qid:d.qid,files:err?null:files,error:err})}
 }else if(e.source===frame.contentWindow){
  if(d.type==='CMS_EV'&&d.ev){
   if(d.ev.kind==='scroll'){lastY=d.ev.y||0;return}
   if(d.ev.kind==='ready'&&pendY){frame.contentWindow.postMessage({cms:1,kind:'scrollTo',y:pendY},'*');lastY=pendY;pendY=null}
   toPanel({type:'CMS_EV',route:current,ev:d.ev})}
  else if(d.type==='ERIC_ROUTE'&&typeof d.route==='string'){if(!CMS.editUI)go(d.route,false,d.at||'')}
  else if(d.type==='ERIC_READY'){toPanel({type:'CMS_VIEW_READY',route:current});if(pendAt){frame.contentWindow.postMessage({type:'ERIC_SCROLL',at:pendAt},'*');pendAt=''}}
 }});

Promise.all([CMS.ready,loadPages()]).then(()=>go('home',true)).catch(err=>{console.error(err);toPanel({type:'CMS_ERROR',msg:err.message||'No pude abrir el sitio.'})});
})();

</script></body></html>
