:root{--ui:#0b0b0a;--ui2:#121211;--ui3:#1a1a18;--line:rgba(239,237,231,.09);--line2:rgba(239,237,231,.16);--tx:#efede7;--tx2:#a9a49b;--tx3:#77736b;--acc:#d9dbdf;--accg:linear-gradient(165deg,#fff 0%,#dcdee2 13%,#8a8e94 29%,#f6f7f9 45%,#b5b8bd 59%,#55585e 77%,#d6d8dc 91%,#7a7d83 100%);--sans:'Instrument Sans',Helvetica,Arial,sans-serif;--serif:'Crimson Pro',Georgia,serif;--bar:58px}
.app-oro{--acc:#d9b874;--accg:linear-gradient(165deg,#fbf0c9 0%,#e6c47c 13%,#a87b33 29%,#f7e4a8 45%,#c8984b 59%,#74521f 77%,#dcb86c 91%,#946c2b 100%)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050505;color:var(--tx);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg{display:block}
[hidden]{display:none!important}
/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 70% 60% at 50% 40%,#151413 0%,#050505 70%)}
.lg-card{width:min(380px,100%);text-align:center}
.lg-mk{width:74px;height:62px;margin:0 auto 26px;background:var(--accg);-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat}
.lg-k{font:400 9.5px/1.6 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--tx3)}
.lg-h{font:italic 400 34px/1.1 var(--serif);margin:10px 0 34px}
.lg-f{text-align:left;display:grid;gap:14px}
.lg-f label{display:grid;gap:6px;font:400 9.5px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--tx3)}
.lg-f input{background:transparent;border:0;border-bottom:1px solid var(--line2);padding:10px 0;font:400 16px/1.4 var(--sans);letter-spacing:0;text-transform:none;color:var(--tx);border-radius:0;outline:0}
.lg-f input:focus{border-bottom-color:var(--acc)}
.lg-btn{margin-top:22px;width:100%;height:50px;background:var(--tx);color:#0b0b0a;font:500 10.5px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase}
.lg-note{margin-top:16px;font-size:12px;color:var(--tx3)}
/* ---------- barra ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:var(--bar);z-index:50;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(11,11,10,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.b-brand{display:flex;align-items:center;gap:10px;margin-right:4px}
.b-mk{width:30px;height:26px;background:var(--accg);-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat}
.b-k{font:400 9.5px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--tx2)}
.b-page{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line2);font-size:13px;white-space:nowrap;max-width:190px;overflow:hidden}
.b-page span{overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line2);height:36px}
.seg button{padding:0 13px;font:400 10px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:7px}
.seg button[aria-pressed=true]{background:var(--tx);color:#0b0b0a}
.b-sp{flex:1}
.b-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);white-space:nowrap}
.b-status i{width:6px;height:6px;border-radius:50%;background:#6b6b66}
.b-status.dirty i{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.b-ic{width:36px;height:36px;display:grid;place-items:center;color:var(--tx2);border:1px solid transparent}
.b-ic:hover{color:var(--tx);border-color:var(--line2)}
.b-pub{position:relative;height:38px;padding:0 20px;color:#0b0b0a;font:600 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;background:var(--accg);background-size:100% 100%;overflow:hidden}
.b-pub::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.menu{position:fixed;z-index:60;min-width:240px;background:var(--ui2);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6);padding:6px}
.menu button,.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;text-align:left;font-size:13.5px;color:var(--tx)}
.menu button:hover{background:var(--ui3)}
.menu button small{margin-left:auto;color:var(--tx3);font-size:11px}
.menu .on{color:var(--acc)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--line2);padding:6px 0;outline:0}
/* ---------- escenario ---------- */
#stageWrap{position:fixed;left:0;right:0;bottom:0;top:var(--bar);background:#050505;transition:right .35s cubic-bezier(.22,.74,.25,1)}
body.sheet-open #stageWrap{right:var(--sheetw,0px)}
#stage{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;background:#070707;scroll-behavior:smooth}
#stageWrap.phone{background:radial-gradient(ellipse 60% 50% at 50% 30%,#141412,#050505)}
#stageWrap.phone #stage{left:50%;right:auto;top:22px;bottom:22px;width:400px;transform:translateX(-50%);border:6px solid #1c1c1a;border-radius:42px;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 0 1px #2a2a27}
#stageWrap.phone #stage::-webkit-scrollbar{display:none}
.undo{position:absolute;left:16px;bottom:16px;z-index:20;display:flex;background:rgba(18,18,17,.94);border:1px solid var(--line2);backdrop-filter:blur(10px)}
.undo button{width:42px;height:40px;display:grid;place-items:center;color:var(--tx2)}
.undo button:disabled{opacity:.3;cursor:default}
.undo button+button{border-left:1px solid var(--line)}
/* ---------- panel lateral ---------- */
#sheet{position:fixed;z-index:55;top:var(--bar);right:0;bottom:0;width:400px;background:var(--ui);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .35s cubic-bezier(.22,.74,.25,1);display:flex;flex-direction:column}
body.sheet-open #sheet{transform:none}
.sh-h{display:flex;align-items:center;gap:12px;padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font:italic 400 24px/1.1 var(--serif);flex:1}
.sh-b{flex:1;overflow:auto;padding:20px}
.sh-k{display:block;font:400 9.5px/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);margin:0 0 10px}
.fld{display:grid;gap:7px;margin-bottom:18px}
.fld>span{font:400 9.5px/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);display:flex;justify-content:space-between}
.fld>span em{font-style:normal;letter-spacing:.05em}
.fld>span em.over{color:#e0a46a}
.fld input,.fld textarea{background:var(--ui2);border:1px solid var(--line2);padding:11px 12px;font-size:14px;border-radius:0;outline:0;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--acc)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line2);padding:14px 12px;text-align:left;display:grid;gap:8px}
.chip[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip b{font:italic 400 18px/1 var(--serif)}
.chip small{color:var(--tx3);font-size:11.5px;line-height:1.4}
.sw{height:26px;border:1px solid var(--line2)}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tg span{flex:1}
.tg i{width:38px;height:22px;border-radius:12px;background:#2a2a27;position:relative;transition:background .25s}
.tg i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#efede7;transition:transform .25s}
.tg[aria-pressed=true] i{background:var(--acc)}
.tg[aria-pressed=true] i::after{transform:translateX(16px);background:#0b0b0a}
.gprev{background:#fff;color:#202124;padding:16px 16px 18px;border-radius:10px;margin:6px 0 20px;font-family:Arial,sans-serif}
.gprev .u{font-size:12px;color:#4d5156;display:flex;gap:8px;align-items:center}
.gprev .u i{width:22px;height:22px;border-radius:50%;background:#111 var(--mki) center/14px no-repeat}
.gprev .t{font-size:18px;color:#1a0dab;margin:6px 0 4px;line-height:1.3}
.gprev .d{font-size:13px;line-height:1.5;color:#4d5156}
.wprev{background:#0b141a;border-radius:10px;padding:8px;margin-bottom:8px}
.wprev .c{background:#1f2c33;border-radius:8px;overflow:hidden;display:flex;gap:0;flex-direction:column}
.wprev img{width:100%;height:150px;object-fit:cover;object-position:50% 18%;filter:grayscale(1)}
.wprev .x{padding:10px 12px;font-family:Arial,sans-serif}
.wprev .x b{display:block;color:#e9edef;font-size:14px;margin-bottom:3px}
.wprev .x span{display:block;color:#8696a0;font-size:12.5px;line-height:1.4;max-height:3.6em;overflow:hidden}
.wprev .x small{display:block;color:#8696a0;font-size:11px;margin-top:6px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lib button{border:1px solid var(--line2);padding:14px 12px 13px;text-align:left;display:grid;gap:10px;transition:border-color .2s,background .2s}
.lib button:hover{border-color:var(--acc);background:var(--ui2)}
.lib .lv{height:62px;background:#141413;display:grid;place-items:center;color:var(--tx3)}
.lib b{font:italic 400 17px/1.1 var(--serif)}
.lib small{color:var(--tx3);font-size:11.5px;line-height:1.4}
.ver{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.ver b{font:italic 400 17px/1.2 var(--serif)}
.ver small{grid-column:1;color:var(--tx3);font-size:12px}
.ver button{grid-row:1/3;grid-column:2;border:1px solid var(--line2);padding:9px 12px;font:400 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase}
.ver button:hover{border-color:var(--acc);color:var(--acc)}
.ver.cur b{color:var(--acc)}
.sh-act{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.sh-act button{border:1px solid var(--line2);padding:10px 12px;font:400 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.sh-act button:hover{border-color:var(--acc)}
.sh-act button.danger:hover{border-color:#c76d5b;color:#e59a88}
.sh-p{color:var(--tx2);font-size:13.5px;line-height:1.6;margin:0 0 18px}
/* ---------- diálogo publicar ---------- */
#pubDlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.pd{width:min(440px,100%);background:var(--ui);border:1px solid var(--line2);padding:28px 26px 24px;box-shadow:0 40px 120px rgba(0,0,0,.7)}
.pd h3{margin:8px 0 8px;font:italic 400 30px/1.1 var(--serif)}
.pd p{margin:0 0 22px;color:var(--tx2);line-height:1.6}
.pd .opts{display:grid;gap:8px;margin-bottom:16px}
.pd .opts button{display:flex;gap:12px;align-items:center;border:1px solid var(--line2);padding:14px;text-align:left}
.pd .opts button[aria-pressed=true]{border-color:var(--acc)}
.pd .opts i{width:14px;height:14px;border-radius:50%;border:1px solid var(--tx3);flex:none}
.pd .opts button[aria-pressed=true] i{border-color:var(--acc);box-shadow:inset 0 0 0 3px var(--ui),inset 0 0 0 7px var(--acc)}
.pd .opts b{display:block;font-weight:500}
.pd .opts small{color:var(--tx3)}
.pd input[type=datetime-local]{width:100%;background:var(--ui2);border:1px solid var(--line2);padding:11px;color-scheme:dark;margin-bottom:16px}
.pd .row{display:flex;gap:10px;justify-content:flex-end}
.pd .row button{height:44px;padding:0 18px;border:1px solid var(--line2);font:400 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
.pd .row .b-pub{border:0}
.pd .prog{height:2px;background:var(--line);margin:4px 0 18px;overflow:hidden}
.pd .prog i{display:block;height:100%;width:0;background:var(--accg)}
.pd .ok{text-align:center;padding:10px 0 6px}
.pd .ok svg{margin:0 auto 14px;color:var(--acc)}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:22px;width:max-content;z-index:90;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.22,.74,.25,1);display:flex;align-items:center;gap:14px;background:#efede7;color:#0b0b0a;padding:13px 16px 13px 18px;box-shadow:0 20px 60px rgba(0,0,0,.5);font-size:13.5px;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;border-bottom:1px solid #0b0b0a;padding-bottom:3px}

/* ===== panel real: complementos ===== */
.lg-h{margin:10px 0 34px;font-weight:400}
.lg-pw{position:relative;display:block}
.lg-pw input{width:100%;padding-right:52px}
.lg-pw button{position:absolute;right:0;top:50%;transform:translateY(-50%);font:400 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--tx3);padding:8px 0 8px 10px}
.lg-btn:disabled{opacity:.6;cursor:progress}
.lg-err{min-height:20px;margin-top:14px;font-size:13px;color:#eba48f}
.lg-note{line-height:1.5}
#site{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050505;display:block}
#stage{overflow:hidden}
#stageWrap.phone #stage{overflow:hidden;width:394px;max-width:calc(100% - 24px)}
#stageLoad{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:#050505;color:var(--tx3);font:400 9.5px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;transition:opacity .5s;z-index:3}
#stageLoad.off{opacity:0;pointer-events:none}
.ld-mk{width:64px;height:54px;background:var(--accg);background-size:200% 200%;-webkit-mask:var(--mk) center/contain no-repeat;mask:var(--mk) center/contain no-repeat;animation:ldm 2.4s ease-in-out infinite}
@keyframes ldm{0%,100%{background-position:0 0;opacity:.6}50%{background-position:100% 100%;opacity:1}}
.b-status.saving i{background:#8f8a81;animation:pulse 1s ease-in-out infinite}
.b-status.err i{background:#e0795f;box-shadow:0 0 10px #e0795f}
@keyframes pulse{50%{opacity:.3}}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:21;width:max-content;max-width:min(620px,calc(100% - 28px));padding:11px 16px;background:rgba(18,18,17,.95);border:1px solid var(--line2);font-size:12.5px;color:var(--tx2);display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.hint b{color:var(--tx);font-weight:500}
.hint button{font:400 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.menu{max-height:calc(100vh - 80px);overflow:auto}
.menu .mk{font:400 9px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--tx3);padding:12px 12px 6px}

.sh-h button{width:36px;height:36px;display:grid;place-items:center;color:var(--tx2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:42px;padding:0 16px;border:1px solid var(--line2);font:400 9.5px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--tx);white-space:nowrap}

.fld select{background:var(--ui2);border:1px solid var(--line2);padding:11px 12px;font-size:14px;border-radius:0;outline:0;color-scheme:dark}
.fld small{color:var(--tx3);font-size:12px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* galería */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.gt{position:relative;aspect-ratio:4/5;background:#141413;overflow:hidden;border:1px solid var(--line)}
.gt img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.15)}
.gt.off img{opacity:.3;filter:grayscale(1)}
.gt .gt-n{position:absolute;left:8px;top:8px;font:400 9px/1 var(--sans);letter-spacing:.18em;background:rgba(10,10,9,.8);padding:6px 7px;color:var(--tx2)}
.gt .gt-off{position:absolute;right:8px;top:8px;font:600 8.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;background:#d9a46a;color:#0b0b0a;padding:6px 7px}
.gt .gt-a{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(10,10,9,.88);border-top:1px solid var(--line)}

.drop{display:grid;place-items:center;gap:8px;padding:22px 14px;border:1px dashed var(--line2);text-align:center;color:var(--tx2);font-size:13px;margin-bottom:18px;width:100%}

.ps.off{opacity:.5}

.empty{padding:26px 16px;border:1px dashed var(--line2);text-align:center;color:var(--tx3);font-size:13px;line-height:1.6;margin-bottom:16px}
.rte{border:1px solid var(--line2);background:var(--ui2)}

.imgf{display:flex;gap:12px;align-items:center}
.imgf .ps-im{width:88px;height:66px}
/* diálogos */
#dlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pd{width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--ui);border:1px solid var(--line2);padding:26px 24px 22px;box-shadow:0 40px 120px rgba(0,0,0,.7)}

 body.sheet-open #stageWrap{right:0}
}

.pd p.small{font-size:13px;color:var(--tx3);margin:-4px 0 18px}
</style>

<script>(()=>{'use strict';
/* ================= Panel de edición · Eric Ramírez ================= */
const CFG=window.ERIC_CMS_CONFIG||{};

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>'n'+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hash=s=>{s=String(s==null?'':s).replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
const blank=()=>({v:1,t:{},i:{},h:{},l:{},vid:{},s:{},seo:{},posts:{historias:[],recursos:[]}});
function norm(c){const b=blank();if(!c||typeof c!=='object')return b;for(const k in b){if(c[k]&&typeof c[k]==='object')b[k]=c[k]}
 b.posts={historias:Array.isArray(b.posts.historias)?b.posts.historias:[],recursos:Array.isArray(b.posts.recursos)?b.posts.recursos:[]};return b}
const same=(a,b)=>JSON.stringify(norm(a))===JSON.stringify(norm(b));
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const today=()=>{const d=new Date();return MONTHS[d.getMonth()]+' '+d.getFullYear()};
const ago=iso=>{if(!iso)return'';const s=(Date.now()-new Date(iso).getTime())/1000;if(s<60)return'hace un momento';if(s<3600)return'hace '+Math.round(s/60)+' min';if(s<86400)return'hace '+Math.round(s/3600)+' h';
 return new Date(iso).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})};
const when=iso=>new Date(iso).toLocaleString('es-MX',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});

/* limpieza de HTML (textos con formato) */
const INERT=document.implementation.createHTMLDocument('');
const INL={EM:0,I:0,STRONG:0,B:0,BR:0,U:0,S:0,SMALL:0,SUP:0,SUB:0,MARK:0,SPAN:1,A:2};
const BLK={P:0,H3:0,H4:0,UL:0,OL:0,LI:0,BLOCKQUOTE:0};
function safeHref(h){h=String(h||'').trim();if(!h)return'';if(/^(https?:|mailto:|tel:|#)/i.test(h))return h;if(/^javascript:|^data:|^vbscript:/i.test(h))return'';if(/^[\w\-./%?=&#]+$/.test(h))return h;return''}
function clean(html,rich){const box=INERT.createElement('div');box.innerHTML=String(html==null?'':html);
 (function walk(n){for(const c of[...n.childNodes]){if(c.nodeType===3)continue;if(c.nodeType!==1){c.remove();continue}
  const tg=c.tagName.toUpperCase();if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|IMG|VIDEO|AUDIO|BUTTON|INPUT|FORM|TEXTAREA|SELECT)$/.test(tg)){c.remove();continue}
  if(rich&&tg==='DIV'){const p=INERT.createElement('p');p.append(...c.childNodes);c.replaceWith(p);walk(p);continue}
  if(rich&&(tg==='H1'||tg==='H2')){const h=INERT.createElement('h3');h.append(...c.childNodes);c.replaceWith(h);walk(h);continue}
  let k=tg in INL?INL[tg]:(rich&&tg in BLK?BLK[tg]:-1);if(tg==='SPAN'&&!rich)k=1;if(tg==='SPAN'&&rich)k=-1;
  if(k===-1){walk(c);c.replaceWith(...c.childNodes);continue}
  for(const a of[...c.attributes]){const nm=a.name.toLowerCase();if(!((k===1&&nm==='class')||(k===2&&(nm==='href'||nm==='target'))))c.removeAttribute(a.name)}
  if(k===2){const h=safeHref(c.getAttribute('href'));if(h)c.setAttribute('href',h);else c.removeAttribute('href');if(/^https?:/.test(h))c.setAttribute('target','_blank')}
  walk(c)}})(box);
 if(rich){const out=INERT.createElement('div');let run=null;for(const n of[...box.childNodes]){const blk=n.nodeType===1&&/^(P|H3|H4|UL|OL|BLOCKQUOTE)$/.test(n.tagName);
   if(blk){run=null;out.appendChild(n)}else if(n.nodeType===1&&n.tagName==='BR'){run=null}else{if(n.nodeType===3&&!n.textContent.trim()&&!run)continue;if(!run){run=INERT.createElement('p');out.appendChild(run)}run.appendChild(n)}}
  [...out.querySelectorAll('p')].forEach(p=>{if(!p.textContent.trim())p.remove()});return out.innerHTML.trim()}
 return box.innerHTML.trim()}
const textOf=html=>{const d=INERT.createElement('div');d.innerHTML=html||'';return d.textContent.replace(/\s+/g,' ').trim()};

function parseVideo(url){url=String(url||'').trim();let m;
 if((m=url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/)))return{kind:'yt',id:m[1],url:'https://youtu.be/'+m[1]};
 if((m=url.match(/open\.spotify\.com\/(?:intl-[\w-]+\/)?(?:embed\/)?(episode|show|track)\/([A-Za-z0-9]+)/)))return{kind:'sp',type:m[1],id:m[2],url:`https://open.spotify.com/${m[1]}/${m[2]}`};
 if(/tiktok\.com\//.test(url)&&/^https:\/\//.test(url)){m=url.match(/\/video\/(\d+)/);return{kind:'tt',id:m?m[1]:'',url}}
 return null}
const KIND={yt:'YouTube',sp:'Spotify',tt:'TikTok'};

const PAGES=[['home','Inicio','index.html'],['conoceme','Conóceme','conoceme.html'],['servicios','Servicios','servicios.html'],['areas','Áreas de práctica','areas/index.html'],
 ['areas/defensa-fiscal','· Defensa Fiscal','areas/defensa-fiscal.html'],['areas/derecho-penal-patrimonial','· Penal Patrimonial','areas/derecho-penal-patrimonial.html'],['areas/amparo','· Amparo','areas/amparo.html'],['areas/intangibles','· Intangibles','areas/intangibles.html'],
 ['eric-tv','Eric TV','eric-tv.html'],['medios','Medios','medios.html'],['historias','Historias de Éxito','historias.html'],['recursos','Recursos','recursos.html'],['clientes','Clientes satisfechos','clientes.html'],['contacto','Contacto','contacto.html']];
const pageName=r=>((PAGES.find(p=>p[0]===r)||[])[1]||r).replace(/^· /,'');

/* ================= almacenamiento ================= */
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return v===undefined?null:false}}
function PhpBackend(cfg){const api=cfg.api;let csrf='',email='';
 async function call(a,opt={}){const o={method:'GET',credentials:'same-origin',headers:{'X-Requested-With':'ecms',Accept:'application/json'}};if(csrf)o.headers['X-CSRF']=csrf;
  if(opt.json!==undefined){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(opt.json)}
  if(opt.form){o.method='POST';o.body=opt.form}
  let r;try{r=await fetch(api+'?a='+a+(opt.q||''),o)}catch(e){throw new Error('Sin conexión con el servidor. Revise su internet.')}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||!j){throw new Error((j&&j.error)||(r.status===413?'El archivo es demasiado pesado.':'Error del servidor ('+r.status+').'))}
  if(j.csrf)csrf=j.csrf;return j}
 return{kind:'php',needsCurrent:true,email:()=>email,
  async restore(){try{const j=await call('estado');if(j.ok){email=j.email;return{email}}}catch(e){}return null},
  async signIn(e,p){const j=await call('entrar',{json:{email:e.trim(),password:p}});email=j.email;return{email}},
  async signOut(){try{await call('salir',{json:{}})}catch(e){}csrf='';email=''},
  async load(){const j=await call('cargar');return{draft:j.draft,published:j.published,pubAt:j.pubAt,base:j.base||null,pubBase:j.pubBase||null}},
  async saveDraft(d){await call('borrador',{json:{data:d}})},
  async publish(d,note,pages){const j=await call('publicar',{json:{data:d,note:note||'',pages:pages||null}});return j.at},
  async versions(){const j=await call('versiones');return(j.items||[]).map(v=>({id:v.id,at:v.at,note:v.note,by:v.by}))},
  async version(id){const j=await call('version',{q:'&id='+encodeURIComponent(id)});return j.data},
  async upload(blob,ext){const f=new FormData();f.append('f',blob,'archivo.'+(ext||'bin'));const j=await call('subir',{form:f});return j.url},
  async changePassword(p,cur){await call('clave',{json:{actual:cur||'',nueva:p}})}}}
const B=PhpBackend(CFG);

/* ================= imágenes ================= */
const canWebp=(()=>{try{return document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp')}catch(e){return false}})();
async function compress(file,max){max=max||2200;if(!/^image\/(jpeg|png|webp|heic|heif|avif)/i.test(file.type||'image/jpeg'))return{blob:file,ext:(file.name.split('.').pop()||'bin').toLowerCase()};
 let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('No se pudo leer la imagen.'));im.src=URL.createObjectURL(file)})}
 const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,s=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
 const g=c.getContext('2d');g.drawImage(src,0,0,c.width,c.height);const type=canWebp?'image/webp':'image/jpeg';
 const blob=await new Promise(r=>c.toBlob(r,type,.86));return{blob,ext:type==='image/webp'?'webp':'jpg'}}
async function uploadImage(file,max){const{blob,ext}=await compress(file,max);return await B.upload(blob,ext)}
function pick(id,multi){return new Promise(res=>{const inp=$('#'+id);inp.value='';const done=()=>{res(multi?[...inp.files]:inp.files[0]||null)};inp.onchange=done;inp.click()})}

function status(){const st=$('#status'),sp=st.querySelector('span');st.classList.remove('dirty','saving','err');const dirty=S.stale||!same(S.content,S.published);
 $('#pubBtn').classList.toggle('dirty',dirty);

 if(dirty){st.classList.add('dirty');sp.textContent=S.stale&&same(S.content,S.published)?'Diseño actualizado: falta publicar':'Cambios sin publicar';return}
 sp.textContent=S.pubAt?'Publicado '+ago(S.pubAt):'Sin cambios'}

function snapshot(){return JSON.stringify(S.content)}
function mutate(fn,opt={}){const now=Date.now();
 if(!(opt.coalesce&&opt.coalesce===lastCoalesce&&now-lastCoalesceAt<2500)){S.undo.push(snapshot());if(S.undo.length>120)S.undo.shift();S.redo=[]}
 lastCoalesce=opt.coalesce||'';lastCoalesceAt=now;
 fn(S.content);undoUI();scheduleSave();sync(opt.render)}

function undoUI(){$('#uBtn').disabled=!S.undo.length;$('#rBtn').disabled=!S.redo.length}
function undo(){if(!S.undo.length)return;S.redo.push(snapshot());S.content=norm(JSON.parse(S.undo.pop()));lastCoalesce='';undoUI();scheduleSave();sync(true)}

function copyPrefix(c,from,to){for(const m of['t','i','h','l']){for(const k of Object.keys(c[m])){if(k.startsWith(from+'/'))c[m][to+'/'+k.slice(from.length+1)]=clone(c[m][k])}}
 for(const k of Object.keys(c.vid)){if(k===from||k.startsWith(from+'/'))c.vid[to+k.slice(from.length)]=c.vid[k]}}
function dropPrefix(c,p){for(const m of['t','i','h','l','vid'])for(const k of Object.keys(c[m]))if(k===p||k.startsWith(p+'/'))delete c[m][k]}
function applyList(lk,sig,items,toastMsg,undoable){mutate(c=>{c.l[lk]={s:sig,items}},{render:true});if(toastMsg)toast(toastMsg,undoable?['Deshacer',undo]:null)}

 const what=ev.section?'Sección':'Elemento';
 if(ev.op==='up'){if(i===0)return toast(ev.section?'Ya es la primera sección.':'Ya está al principio.');items.splice(i-1,0,items.splice(i,1)[0]);applyList(ev.lk,ev.sig,items)}
 else if(ev.op==='down'){if(i===items.length-1)return toast(ev.section?'Ya es la última sección.':'Ya está al final.');items.splice(i+1,0,items.splice(i,1)[0]);applyList(ev.lk,ev.sig,items)}
 else if(ev.op==='hide'){it.x=it.x?0:1;applyList(ev.lk,ev.sig,items,it.x?what+' oculta: los visitantes no la verán.':what+' visible de nuevo.',true)}
 else if(ev.op==='dup'){const nid=uid();items.splice(i+1,0,{id:nid,b:it.b,x:0});mutate(c=>{copyPrefix(c,ev.lk+'~'+it.id,ev.lk+'~'+nid);c.l[ev.lk]={s:ev.sig,items}},{render:true});toast(what+' duplicada.',['Deshacer',undo])}
 else if(ev.op==='del'){const name=ev.section?((ev.library||[]).find(x=>x.id===it.id)||{}).name:'';
  const run=()=>{items.splice(i,1);mutate(c=>{dropPrefix(c,ev.lk+'~'+it.id);c.l[ev.lk]={s:ev.sig,items}},{render:true});toast(ev.section?'Sección eliminada.':'Elemento quitado.',['Deshacer',undo])};

 else if(ev.op==='add'){const lib=[];const seen=new Set();(ev.library||[]).forEach(x=>{if(!seen.has(x.b)){seen.add(x.b);lib.push(x)}});
  dialog(`<div class="pd-k">Agregar sección</div><h3>¿Qué sección agrego debajo?</h3><p>Se agrega una copia con el mismo diseño; después cambie los textos con un toque.</p><div class="lib">${lib.map((x,k)=>`<button data-k="${k}"><b>${esc(x.name)}</b></button>`).join('')}</div><div class="row"><button class="btn" data-x>Cancelar</button></div>`,box=>{

$('#dDesk').onclick=()=>setDev('desk');$('#dPhone').onclick=()=>setDev('phone');
$('#uBtn').onclick=undo;$('#rBtn').onclick=redo;
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){e.preventDefault();e.shiftKey?redo():undo()}});

/* ================= publicar ================= */
$('#pubBtn').onclick=()=>{const dirty=S.stale||!same(S.content,S.published);
 if(!dirty)return toast(S.pubAt?'Todo está publicado. No hay cambios pendientes.':'Aún no hay cambios que publicar.');
 dialog(`<div class="pd-k">Publicar</div><h3>¿Publicamos los cambios?</h3><p>Se verán de inmediato en ericramirez.com.mx. Queda una copia en el historial por si quiere regresar.</p>
  <div class="fld"><span>Nota para el historial (opcional)</span><input type="text" id="pn" placeholder="Ej. Nueva foto y textos de servicios"></div><div class="prog2" hidden><i></i></div>
  <div class="row"><button class="btn" data-x>Cancelar</button><button class="btn gold" id="go">Publicar ahora</button></div>`,b=>{
  $('#go',b).onclick=async()=>{const bt=$('#go',b);bt.disabled=true;bt.textContent='Publicando…';const pr=b.querySelector('.prog2');pr.hidden=false;pr.firstElementChild.style.width='60%';
   try{clearTimeout(saveT);let pages=null;if(CFG.marco){bt.textContent='Generando páginas…';pages=await buildPages();pr.firstElementChild.style.width='80%';bt.textContent='Publicando…'}
    const at=await B.publish(S.content,$('#pn',b).value.trim(),pages);S.published=clone(S.content);S.stale=false;S.pubAt=at||new Date().toISOString();pr.firstElementChild.style.width='100%';status();
    $('.pd',$('#dlg')).innerHTML=`<div class="ok" style="text-align:center;padding:8px 0"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="margin:0 auto 14px;color:var(--acc)"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><h3>Publicado</h3><p>${'Ya está en línea. Cualquier visitante ve la versión nueva.'}</p><div class="row" style="justify-content:center"><button class="btn pri" data-x>Seguir editando</button>${'<button class="btn" id="vw">Ver sitio ↗</button>'}</div></div>`;
    $$('[data-x]',$('#dlg')).forEach(x=>x.onclick=closeDlg);const vw=$('#vw',$('#dlg'));if(vw)vw.onclick=()=>window.open(new URL(CFG.site||'/',location.href).href,'_blank','noopener')}
   catch(e){bt.disabled=false;bt.textContent='Publicar ahora';pr.hidden=true;toast(e.message||'No se pudo publicar. Revise su conexión.')}}})};

/* ================= avisos ================= */
let toastT=0;function toast(msg,act){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${act?`<button>${esc(act[0])}</button>`:''}`;t.classList.add('on');
 if(act)t.querySelector('button').onclick=()=>{t.classList.remove('on');act[1]()};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),act?5200:3200)}
let hinted=false;function firstHint(){if(hinted||ls('eric-cms-hint'))return;hinted=true;const h=$('#hint');h.innerHTML=`<span><b>Toque cualquier texto o foto</b> para cambiarlo. Las secciones tienen su barra para moverlas u ocultarlas.</span><button>Entendido</button>`;h.hidden=false;h.querySelector('button').onclick=()=>{h.hidden=true;ls('eric-cms-hint',1)};setTimeout(()=>{h.hidden=true},14000)}
addEventListener('beforeunload',e=>{if(S.saving||saveT){saveNow()}});

/* ================= entrada ================= */

async function start(user){$('#login').hidden=true;$('#app').hidden=false;
 try{const d=await B.load();S.published=norm(d.published);S.pubAt=d.pubAt;S.content=norm(d.draft||d.published);S.stale=!!(d.base&&d.pubBase&&d.base!==d.pubBase);
  if(S.stale)setTimeout(()=>toast('Se actualizó el diseño del sitio. Toque Publicar para aplicarlo junto con sus cambios.'),2500)}catch(e){toast(e.message||'No pude cargar el contenido.');S.content=blank();S.published=blank()}
 status();undoUI();loadSite();
 setTimeout(()=>{if(!S.shellReady){$('#stageLoad span').textContent='El sitio tarda en abrir… revise su conexión.'}},9000)}
const lgErr=$('#lgErr');
async function doLogin(){const em=$('#lgEmail').value.trim(),pw=$('#lgPass').value;lgErr.textContent='';if(!em||!pw){lgErr.textContent='Escriba su correo y su contraseña.';return}
 const bt=$('#lgBtn');bt.disabled=true;bt.textContent='Entrando…';
 try{const u=await Promise.race([B.signIn(em,pw),sleep(20000).then(()=>{throw new Error('La conexión tardó demasiado. Intente de nuevo.')})]);await start(u)}
 catch(e){lgErr.textContent=e.message||'No se pudo entrar.';bt.disabled=false;bt.textContent='Entrar'}}
$('#lgBtn').onclick=doLogin;['lgEmail','lgPass'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}}));
$('#lgShow').onclick=()=>{const p=$('#lgPass');p.type=p.type==='password'?'text':'password';$('#lgShow').textContent=p.type==='password'?'Ver':'Ocultar'};
$('#lgNote').textContent='Acceso exclusivo. Su sesión queda abierta en este dispositivo.';
(async()=>{try{const u=await B.restore();if(u)return start(u)}catch(e){}$('#login').hidden=false})();
})();
</script>
</body>
</html>
